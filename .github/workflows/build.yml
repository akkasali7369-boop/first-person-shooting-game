name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot ~/.config/godot
          cp -r /root/.local/share/godot/. ~/.local/share/godot/
          cp -r /root/.config/godot/. ~/.config/godot/

      - name: Import assets
        run: godot --headless --verbose --import || true

      - name: Export APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/game.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android
